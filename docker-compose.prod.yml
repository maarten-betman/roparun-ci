# Production compose for Coolify (or any Docker host).
#
# Design: a single HTTP service is exposed (`web`), nginx serves the built
# SPA and reverse-proxies /api and /ws to the api container on the internal
# compose network. The api container runs Alembic migrations on startup
# (see backend/docker-entrypoint.sh).
#
# Required env vars (set these in Coolify):
#   POSTGRES_PASSWORD        — strong random string
#   ROPARUN_CORS_ORIGINS     — JSON list, e.g. '["https://roparun.example.com"]'
# Optional:
#   VITE_MAPTILER_KEY        — falls back to demotiles when unset
#   ROPARUN_ADMIN_TOKEN      — enables /admin console; leave unset to keep
#                              the admin endpoints returning 503
#
# After first deploy, run the seed once:
#   docker compose -f docker-compose.prod.yml exec api python -m app.scripts.seed

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: roparun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: roparun
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roparun"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      ROPARUN_DATABASE_URL: postgresql+psycopg://roparun:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/roparun
      ROPARUN_CORS_ORIGINS: ${ROPARUN_CORS_ORIGINS:-["*"]}
      ROPARUN_ENV: prod
      # Shared secret for /admin/*. Unset → admin endpoints return 503
      # and the /admin page shows an explanatory banner. Set this to a
      # long random string in Coolify to enable the console.
      ROPARUN_ADMIN_TOKEN: ${ROPARUN_ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Give alembic + uvicorn time to come up before the counter starts.
      start_period: 30s

  web:
    build:
      # Context is the repo root so the Dockerfile can COPY both frontend/
      # and docs/ — the Hulp page imports docs/gebruik/*.md via Vite ?raw.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        # Wait for the api to be healthy so nginx never proxies to a dead
        # upstream on first boot (Traefik routes based on this state too).
        condition: service_healthy
    # Coolify's Traefik discovers the service via Docker labels + the compose
    # network and terminates TLS upstream. `expose:` (internal-only) is what
    # Coolify expects; switching to `ports:` made Coolify skip Traefik routing
    # for this service, so no ACME cert was issued. If you're running this
    # compose file *without* Coolify, replace `expose:` with
    # `ports: ["80:80"]` to publish to the host.
    expose:
      - "80"
    healthcheck:
      # Use 127.0.0.1 (not `localhost`) so busybox wget doesn't try ::1 first
      # and get Connection Refused. `--spider` avoids writing a response body;
      # busybox wget returns non-zero on HTTP status >= 400.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
