# Production compose for Coolify (or any Docker host).
#
# Design: a single HTTP service is exposed (`web`), nginx serves the built
# SPA and reverse-proxies /api and /ws to the api container on the internal
# compose network. The api container runs Alembic migrations on startup
# (see backend/docker-entrypoint.sh).
#
# Required env vars (set these in Coolify):
#   POSTGRES_PASSWORD        — strong random string
#   ROPARUN_CORS_ORIGINS     — JSON list, e.g. '["https://roparun.example.com"]'
# Optional:
#   VITE_MAPTILER_KEY        — falls back to demotiles when unset
#
# After first deploy, run the seed once:
#   docker compose -f docker-compose.prod.yml exec api python -m app.scripts.seed

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: roparun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: roparun
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roparun"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      ROPARUN_DATABASE_URL: postgresql+psycopg://roparun:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/roparun
      ROPARUN_CORS_ORIGINS: ${ROPARUN_CORS_ORIGINS:-["*"]}
      ROPARUN_ENV: prod
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    # Coolify's Traefik discovers the service via Docker labels + the compose
    # network and terminates TLS upstream. `expose:` (internal-only) is what
    # Coolify expects; switching to `ports:` made Coolify skip Traefik routing
    # for this service, so no ACME cert was issued. If you're running this
    # compose file *without* Coolify, replace `expose:` with
    # `ports: ["80:80"]` to publish to the host.
    expose:
      - "80"

volumes:
  db_data:
