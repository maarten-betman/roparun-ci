services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: roparun
      POSTGRES_PASSWORD: roparun
      POSTGRES_DB: roparun
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roparun"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ROPARUN_DATABASE_URL: postgresql+psycopg://roparun:roparun@db:5432/roparun
      ROPARUN_CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app

volumes:
  db_data:
