server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — viewer/main.tsx dispatches on pathname.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tracker PWA (separate Vite input).
    location /tracker.html {
        try_files $uri =404;
    }

    # Proxy API requests to the FastAPI container in the same compose network.
    # Strips the /api prefix so the backend sees its routes at the root
    # (same behavior as the Vite dev proxy in vite.config.ts).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket endpoint for Phase 3 live tracking (/ws/live).
    location /ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
