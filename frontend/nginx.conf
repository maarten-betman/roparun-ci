server {
    listen 80;
    # Also listen on IPv6: the nginx:alpine 10-listen-on-ipv6-by-default.sh
    # entrypoint *skips* adding this when our config diverges from the
    # packaged default, so `wget http://localhost/` in the healthcheck (which
    # resolves localhost to ::1 first on alpine) would get Connection Refused.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker Compose's internal DNS. Using a resolver (plus a variable in
    # proxy_pass below) makes nginx resolve upstream names at request time
    # instead of startup — so if the `api` container is briefly unreachable
    # during deploy/restart, nginx keeps running and just 502s the affected
    # request rather than exiting fatally with "host not found in upstream".
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Hashed asset filenames can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML entry points must always be revalidated. They embed the
    # content-hashed asset URLs, and a stale cached copy of index.html
    # pins users to ancient JS across deploys — that's what caused the
    # "toggles don't work" / "phase-3 code isn't there yet" reports.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /tracker.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Screenshot images for the /hulp handbook. Vite copies them in from
    # frontend/public/hulp-img/. Explicit block so a missing image returns
    # 404 instead of falling through to the SPA (which would otherwise
    # serve text/html for a .png URL).
    location /hulp-img/ {
        try_files $uri =404;
    }

    # SPA fallback — viewer/main.tsx dispatches on pathname.
    # Note: deliberately NO `$uri/` in try_files. If a static-asset folder
    # ever ends up sharing its prefix with a SPA route (e.g. a public/foo/
    # asset folder next to a /foo SPA route), `$uri/` would match the
    # directory, the index module would fail to find an index.html, and
    # nginx would return 403. Keep it file-only and let the fallback to
    # /index.html always take over for non-file paths.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri /index.html;
    }

    # Proxy API requests to the FastAPI container in the same compose network.
    # Strips the /api prefix so the backend sees its routes at the root
    # (same behavior as the Vite dev proxy in vite.config.ts).
    #
    # Note: because proxy_pass uses a variable (required so nginx resolves
    # "api" at request-time via the Docker resolver instead of at config-load
    # time), nginx does NOT automatically rewrite the URI. We strip the /api
    # prefix explicitly with `rewrite ... break`. Without this, requests hit
    # http://api:8000/api/public/... and FastAPI 404s.
    location /api/ {
        set $upstream_api "http://api:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Race photo/video uploads (admin) can be large; the backend caps
        # at ROPARUN_MAX_UPLOAD_MB (default 200). Keep nginx's limit in
        # step so big videos reach the app instead of a bare nginx 413.
        client_max_body_size 250m;
    }

    # WebSocket endpoint for Phase 3 live tracking (/ws/live).
    # Here the upstream *does* want the /ws/ prefix, so we pass the URI
    # through unchanged (variable proxy_pass forwards the original URI).
    location /ws/ {
        set $upstream_ws "http://api:8000";
        proxy_pass $upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
