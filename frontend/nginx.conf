server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker Compose's internal DNS. Using a resolver (plus a variable in
    # proxy_pass below) makes nginx resolve upstream names at request time
    # instead of startup — so if the `api` container is briefly unreachable
    # during deploy/restart, nginx keeps running and just 502s the affected
    # request rather than exiting fatally with "host not found in upstream".
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Hashed asset filenames can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — viewer/main.tsx dispatches on pathname.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tracker PWA (separate Vite input).
    location /tracker.html {
        try_files $uri =404;
    }

    # Proxy API requests to the FastAPI container in the same compose network.
    # Strips the /api prefix so the backend sees its routes at the root
    # (same behavior as the Vite dev proxy in vite.config.ts).
    location /api/ {
        set $upstream_api "http://api:8000";
        proxy_pass $upstream_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket endpoint for Phase 3 live tracking (/ws/live).
    location /ws/ {
        set $upstream_ws "http://api:8000";
        proxy_pass $upstream_ws/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
